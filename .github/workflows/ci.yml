name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff format --check browser_agent tests scripts
      - run: uv run ruff check browser_agent tests scripts
      - run: uv run pyright
      - run: uv run pytest tests/test_models.py tests/test_browser_contract.py tests/test_state_contract.py
      - run: uv run pytest
      - run: uv run python scripts/cutover_audit.py

  linux-real-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: >-
          uv run pytest
          tests/test_nodriver_lifecycle.py
          tests/test_nodriver_page_actions.py
          tests/test_nodriver_workflows.py
